services:
  # ==================== 数据库 ====================
  campushub-db:
    image: mysql:8.0
    container_name: campushub-mysql
    restart: always
    environment:
      MYSQL_DATABASE: campushub_db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - campushub-net
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # 不暴露端口到宿主机，仅内网访问

  # ==================== 缓存 ====================
  campushub-redis:
    image: redis:7.0-alpine
    container_name: campushub-redis
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - campushub-net
    command: redis-server --appendonly yes
    # 不暴露端口到宿主机，仅内网访问

  # ==================== 后端 ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campushub-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      CAMPUSHUB_JWT_SECRET: ${CAMPUSHUB_JWT_SECRET:?set CAMPUSHUB_JWT_SECRET in .env}
    depends_on:
      - campushub-db
      - campushub-redis
    networks:
      - campushub-net
    # 不暴露端口到宿主机，仅 nginx 通过内网访问

  # ==================== 前端 + Nginx ====================
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campushub-nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - campushub-net

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

networks:
  campushub-net:
    driver: bridge
