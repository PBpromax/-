workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop")'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop")'
    - when: never

stages:
  - check
  - summary

frontend-check:
  stage: check
  image: node:20
  rules:
    - exists:
        - frontend/package.json
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  before_script:
    - cd frontend
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint --if-present
    - npm run build --if-present

backend-check:
  stage: check
  image: maven:3.9-eclipse-temurin-17
  rules:
    - exists:
        - backend/pom.xml
  cache:
    key:
      files:
        - backend/pom.xml
    paths:
      - .m2/repository/
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  before_script:
    - cd backend
  script:
    - mvn -B verify
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - backend/target/surefire-reports/
      - backend/target/site/jacoco/

ci-summary:
  stage: summary
  image: alpine:3.20
  when: always
  needs:
    - job: frontend-check
      optional: true
    - job: backend-check
      optional: true
  script:
    - |
      if [ ! -f frontend/package.json ]; then
        echo "Frontend check skipped: frontend/package.json not found"
      fi
      if [ ! -f backend/pom.xml ]; then
        echo "Backend check skipped: backend/pom.xml not found"
      fi
